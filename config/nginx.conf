# This file is included inside the http{} block, so the zone can be defined here.
# Rendering is CPU heavy: allow 6 renders per minute per client, with a small burst.
limit_req_zone $binary_remote_addr zone=render:10m rate=6r/m;

server {
    listen 80 default_server;
    root /app;
    access_log /var/log/nginx/rssbridge.access.log;
    error_log /var/log/nginx/rssbridge.error.log;
    index index.php;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://github.blog; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

    location ~ /(\.|vendor|tests) {
        deny all;
        return 403; # Forbidden
    }

    # Only needed server side by openscad, no reason to serve them
    location ~ \.(sh|scad|dxf)$ {
        deny all;
        return 403; # Forbidden
    }

    location ~ \.php$ {
        limit_req zone=render burst=3 nodelay;
        limit_req_status 429;
        include snippets/fastcgi-php.conf;
        fastcgi_pass 127.0.0.1:9000;
    }
}
