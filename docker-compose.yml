
services:
  bottle_clips_online:
    container_name: bottle_clips_online
    build:
      context: BottleClipOnline
      dockerfile: Dockerfile
    restart: unless-stopped
    # openscad renders are CPU heavy, keep them from starving the host
    cpus: 2
    mem_limit: 1g
    pids_limit: 200
    security_opt:
      - no-new-privileges:true
    ports:
      - 8080:80
